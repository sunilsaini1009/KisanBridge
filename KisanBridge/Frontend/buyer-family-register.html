<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family / Household Registration - KisanBridge</title>
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="site-header">
    <div class="navbar-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">🌾</span>
        <span>Kisan<span class="accent">Bridge</span></span>
      </a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="marketplace.html" class="nav-link">Marketplace</a></li>
        <li><a href="buyer-category.html" class="nav-link active">Buyers</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="nav-cart-btn">🛒<span class="nav-cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="section-padding-sm">
    <div class="container-narrow">
      <div class="form-header">
        <span class="badge badge-purple" style="margin-bottom: 12px;">🏠 Household Onboarding</span>
        <h2>Family & Household Registration</h2>
        <p>Get pesticide-free, fresh harvested vegetables delivered directly from local farmers.</p>
      </div>

      <div class="form-wrapper">
        <form id="buyer-registration-form">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="buyerName">Your Full Name *</label>
              <input type="text" class="form-control" id="buyerName" placeholder="e.g. Priya Sharma" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="buyerPhone">Mobile Number *</label>
              <input type="tel" class="form-control" id="buyerPhone" placeholder="10-digit number" maxlength="10" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="buyerEmail">Email Address</label>
              <input type="email" class="form-control" id="buyerEmail" placeholder="e.g. priya@gmail.com">
            </div>

            <div class="form-group">
              <label class="form-label" for="familySize">Family Size (Members)</label>
              <select class="form-control" id="familySize">
                <option value="2-3">Small (2 - 3 Members)</option>
                <option value="4-6" selected>Medium (4 - 6 Members)</option>
                <option value="7+">Joint Family (7+ Members)</option>
              </select>
            </div>

            <div class="form-group col-span-2">
              <label class="form-label" for="buyerAddress">Delivery Address *</label>
              <input type="text" class="form-control" id="buyerAddress" placeholder="Flat No., Tower, Society, Street" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="buyerCity">City *</label>
              <input type="text" class="form-control" id="buyerCity" value="Gurugram" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="buyerPincode">Pincode *</label>
              <input type="text" class="form-control" id="buyerPincode" placeholder="e.g. 122011" maxlength="6" required>
            </div>

            <div class="form-group col-span-2">
              <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="weeklyBoxOptIn" checked style="width: 18px; height: 18px; accent-color: var(--purple);">
                <span>Sign me up for the weekly curated <strong>₹299 Farm-Fresh Veg Basket</strong> (Cancel anytime)</span>
              </label>
            </div>
          </div>

          <div style="margin-top: 32px;">
            <button type="submit" class="btn btn-purple btn-full btn-lg">
              Start Shopping Fresh Produce →
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p style="color: #9CA3AF;">© 2026 KisanBridge</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/buyer-form.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      BuyerFormController.init('Family/Household');
    });
  </script>
</body>
</html>
