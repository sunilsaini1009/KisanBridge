<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event & Catering Bulk Booking - KisanBridge</title>
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="site-header">
    <div class="navbar-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">🌾</span>
        <span>Kisan<span class="accent">Bridge</span></span>
      </a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="marketplace.html" class="nav-link">Marketplace</a></li>
        <li><a href="buyer-category.html" class="nav-link active">Buyers</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="nav-cart-btn">🛒<span class="nav-cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="section-padding-sm">
    <div class="container-narrow">
      <div class="form-header">
        <span class="badge badge-purple" style="margin-bottom: 12px;">🎉 Event Bulk Harvest</span>
        <h2>Wedding, Event & Catering Bulk Booking</h2>
        <p>Procure farm-harvested produce for weddings and events with on-time delivery guarantees.</p>
      </div>

      <div class="form-wrapper">
        <form id="buyer-registration-form">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="buyerName">Organizer / Caterer Name *</label>
              <input type="text" class="form-control" id="buyerName" placeholder="e.g. Rajesh Khurana" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="buyerPhone">Mobile Number *</label>
              <input type="tel" class="form-control" id="buyerPhone" placeholder="10-digit number" maxlength="10" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="eventDate">Event Date *</label>
              <input type="date" class="form-control" id="eventDate" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="guestCount">Estimated Guest Count</label>
              <input type="number" class="form-control" id="guestCount" placeholder="e.g. 800 Guests">
            </div>

            <div class="form-group col-span-2">
              <label class="form-label" for="buyerAddress">Event Venue Address *</label>
              <input type="text" class="form-control" id="buyerAddress" placeholder="Resort / Banquet Hall / Ground location" required>
            </div>

            <div class="form-group col-span-2">
              <label class="form-label" for="cropList">Estimated Crop List & Quantities</label>
              <textarea class="form-control" id="cropList" rows="3" placeholder="e.g. Tomatoes: 150kg, Onions: 200kg, Potatoes: 250kg, Paneer/Dairy, etc."></textarea>
            </div>
          </div>

          <div style="margin-top: 32px;">
            <button type="submit" class="btn btn-purple btn-full btn-lg">
              Submit Event Inquiry & Browse Catalog →
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p style="color: #9CA3AF;">© 2026 KisanBridge Event Services</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/buyer-form.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      BuyerFormController.init('Event/Catering');
    });
  </script>
</body>
</html>
